name: Deploy Notification Service

on:
  push:
    branches: [main]
    paths:
      - 'backend/Services/Notification/**'
      - 'backend/Shared/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish backend/Services/Notification/HotelOS.Notification.API -c Release -o publish/notification

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Enable WebSockets on App Service
        run: |
          RG=$(az webapp show --name hotelos-notification --query resourceGroup -o tsv)
          az webapp config set --name hotelos-notification --resource-group $RG --web-sockets-enabled true

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: hotelos-notification
          package: publish/notification
